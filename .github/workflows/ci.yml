name: CI

on:
  push:
    branches: [main, dev]
  # Every pull request, whatever its base. Sprint work lands as stacked PRs
  # (each based on the previous branch); filtering on main/dev meant only the
  # bottom of a stack was ever checked.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type-check
        run: mypy src
      - name: Offline tests
        run: pytest -q --ignore=tests/integration
      - name: Report integration availability
        # Pytest 8+ exits 5 when every collected test is skipped (no
        # ta-taxonomies / no Neo4j). That report is expected; only a real
        # failure (or collection error) should fail the job.
        run: |
          set +e
          pytest -q tests/integration -rs
          status=$?
          set -e
          if [ "$status" -eq 0 ] || [ "$status" -eq 5 ]; then
            exit 0
          fi
          exit "$status"
      - name: Install pinned taxonomy contract
        run: pip install -e ".[taxonomies]"
      - name: Verify taxonomy contract compatibility
        run: pytest -q tests/integration/test_taxonomy_contract.py
