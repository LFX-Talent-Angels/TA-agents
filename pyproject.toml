[project]
name = "talent-angels"
version = "0.0.1"
description = "A suite of AI Graph Agents that reason over skill, task, and occupation taxonomies via Graph-RAG."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "The Talent Angels Authors" }]
keywords = ["graph-rag", "knowledge-graph", "ai-agents", "skills", "taxonomies", "esco", "onet", "sfia"]
dependencies = [
  # Stack per TA-workspace ADR-0005 (versions pinned as code lands).
  "pydantic>=2",
  "langgraph",
  "anthropic",
  "fastapi",
  "python-dotenv",
  "pyyaml",
  # "ta-taxonomies" — the suite-contract library (sibling repo), added once
  # its first version is published/installable (ADR-0004).
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/LFX-Talent-Angels"
Workspace = "https://github.com/LFX-Talent-Angels/TA-workspace"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talent_angels"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["talent_angels"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
